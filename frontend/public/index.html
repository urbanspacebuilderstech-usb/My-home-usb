<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#2563EB" />
        <meta name="description" content="Construction Accounting CRM & Project Operations System" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="My Home USB" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>My Home USB</title>
        <!--
        Sep 30 2026 — Fonts used to be an @import at the top of index.css, so
        the browser only found them after downloading the whole app stylesheet
        and then held the first paint until Google's CSS arrived. Loaded here
        in parallel and without blocking; display=swap shows text right away.
        -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
        <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" /></noscript>
        <!--
        These scripts have been added for the Visual Edits, please do not edit or remove them
        -->
        <script>
            // Only load visual edit scripts when inside an iframe
            if (window.self !== window.top) {
                // Preview logger: wraps fetch/XHR and posts errors to the Emergent
                // preview panel. It used to be a render-blocking <script> for every
                // visitor; outside the preview iframe it has no parent to report to.
                var emergentMainScript = document.createElement('script');
                emergentMainScript.src = 'https://assets.emergent.sh/scripts/emergent-main.js';
                document.head.appendChild(emergentMainScript);

                // Load debug monitor script
                var debugMonitorScript = document.createElement('script');
                debugMonitorScript.src = 'https://assets.emergent.sh/scripts/debug-monitor.js';
                document.head.appendChild(debugMonitorScript);

                // Configure Tailwind
                window.tailwind = window.tailwind || {};
                tailwind.config = {
                    corePlugins: { preflight: false },
                };

                // Load Tailwind CDN
                var tailwindScript = document.createElement('script');
                tailwindScript.src = 'https://cdn.tailwindcss.com';
                document.head.appendChild(tailwindScript);
            }
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
        <!-- Badge removed -->
        <script>
          // Service Worker cleanup. The kill-switch SW at /sw.js will run
          // once, unregister itself, and clear all caches — preventing the
          // "Offline" lockout caused by the previous SW. We deliberately
          // re-register here so any client that's already on a stale page
          // still triggers the kill-switch on their next refresh.
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
              navigator.serviceWorker.register('/sw.js').catch(function () {});
              // Defensive: explicitly unregister any straggler SWs even if
              // the kill-switch failed (e.g. old browser, weird cache state).
              if (navigator.serviceWorker.getRegistrations) {
                navigator.serviceWorker.getRegistrations()
                  .then(function (regs) {
                    regs.forEach(function (r) {
                      if (r.active && r.active.scriptURL.indexOf('/sw.js') > -1) {
                        // The kill-switch SW handles cache deletion on activate.
                        // We unregister here as well so the next page load is SW-free.
                        r.unregister().catch(function () {});
                      }
                    });
                  })
                  .catch(function () {});
                // Wipe the Cache Storage too, in case the legacy SW seeded it.
                if (window.caches && caches.keys) {
                  caches.keys().then(function (keys) {
                    keys.forEach(function (k) { caches.delete(k).catch(function () {}); });
                  }).catch(function () {});
                }
              }
            });
          }
        </script>
    </body>
</html>
