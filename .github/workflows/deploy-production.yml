# VPS_APP_PATH secret corrected to /var/www/myhomeusb/app
name: Deploy to Hostinger VPS (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build frontend on GitHub runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build with production env
        working-directory: frontend
        env:
          CI: false
        run: |
          echo "REACT_APP_BACKEND_URL=https://myhomeusb.com" > .env
          yarn build

      - name: Update backend code on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}
            echo "==> Pulling latest main (backend code)"
            git fetch --all
            git reset --hard origin/main

            echo "==> Installing backend deps"
            cd backend
            if [ -f requirements.txt ]; then
              if [ -d venv ]; then
                source venv/bin/activate
              fi
              pip install -r requirements.txt || true
            fi
            cd ..

            echo "==> Preparing fresh build directory"
            rm -rf frontend/build

      - name: Copy built frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "frontend/build/"
          target: "${{ secrets.VPS_APP_PATH }}"
          overwrite: true

      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}

            echo "==> Restoring production frontend .env on VPS"
            echo "REACT_APP_BACKEND_URL=https://myhomeusb.com" > frontend/.env

            echo "==> Ensuring swap exists (OOM protection)"
            if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab || true
            fi

            echo "==> Restarting PM2 backend (retrying on transient resource-throttle kills)"
            set +e
            RESTART_OK=0
            for attempt in 1 2 3; do
              echo "--- Attempt $attempt ---"
              pm2 stop all && pm2 start all --update-env
              if [ $? -eq 0 ]; then
                RESTART_OK=1
                break
              fi
              echo "Attempt $attempt failed, waiting 15s before retry..."
              sleep 15
            done
            set -e
            if [ "$RESTART_OK" -ne 1 ]; then
              echo "PM2 restart failed after 3 attempts"
              exit 1
            fi
            pm2 save

            echo "==> Verifying deployment"
            ls frontend/build/index.html
            pm2 status
            echo "===DEPLOY COMPLETE==="

      # TEMPORARY — reopens labour RABs stranded by a cheque bounce that
      # predates the reopen fix. Reviewed against the live audit first: 9
      # bounced labour expenses, 8 fully re-paid, 1 stranded (RAB-07,
      # Venkatesh, 1,00,000). Guarded and idempotent — it re-scans before
      # writing and skips anything already reopened or since re-paid, so a
      # repeat deploy is a no-op. REMOVE once it has run.
      - name: 'labour bounce backfill (dry run)'
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: cd ${{ secrets.VPS_APP_PATH }}/backend && { [ -d venv ] && . venv/bin/activate || true; } && $(command -v python || command -v python3) scripts/reopen_stranded_labour_rabs.py

      # Apply fails only on a genuine error; the separate assert step fails
      # only if anything is still stranded. Two steps, two distinguishable
      # signals — a crash and a write that did not stick used to look identical.
      - name: 'labour bounce backfill (apply)'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: cd ${{ secrets.VPS_APP_PATH }}/backend && { [ -d venv ] && . venv/bin/activate || true; } && $(command -v python || command -v python3) scripts/reopen_stranded_labour_rabs.py --apply

      - name: 'labour bounce backfill (assert clean)'
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: cd ${{ secrets.VPS_APP_PATH }}/backend && { [ -d venv ] && . venv/bin/activate || true; } && $(command -v python || command -v python3) scripts/reopen_stranded_labour_rabs.py --assert-clean

      # TEMPORARY — USB-MR034 repair. Dry run first, then apply+verify. Both
      # corrections are individually guarded and idempotent, so a repeat deploy
      # is a no-op rather than a double-count. REMOVE once it has run.
      - name: 'USB-MR034 repair (dry run)'
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: cd ${{ secrets.VPS_APP_PATH }}/backend && { [ -d venv ] && . venv/bin/activate || true; } && $(command -v python || command -v python3) scripts/repair_usb_mr034_suspense_and_cheque.py

      - name: 'USB-MR034 repair (apply + verify)'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: cd ${{ secrets.VPS_APP_PATH }}/backend && { [ -d venv ] && . venv/bin/activate || true; } && $(command -v python || command -v python3) scripts/repair_usb_mr034_suspense_and_cheque.py --apply

