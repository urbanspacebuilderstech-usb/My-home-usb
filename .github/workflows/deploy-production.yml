# VPS_APP_PATH secret corrected to /var/www/myhomeusb/app
name: Deploy to Hostinger VPS (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build frontend on GitHub runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      # webpack + babel-loader persistent cache. Restored after install so a
      # warm build only recompiles the files that changed.
      - name: Restore webpack build cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.cache
          key: cra-build-${{ hashFiles('frontend/yarn.lock', 'frontend/craco.config.js') }}-${{ github.sha }}
          restore-keys: |
            cra-build-${{ hashFiles('frontend/yarn.lock', 'frontend/craco.config.js') }}-

      - name: Build with production env
        working-directory: frontend
        env:
          CI: false
          # Source maps roughly double build time and upload size and are not
          # served to anyone in production.
          GENERATE_SOURCEMAP: false
        run: |
          echo "REACT_APP_BACKEND_URL=https://myhomeusb.com" > .env
          yarn build

      - name: Update backend code on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}
            echo "==> Pulling latest main (backend code)"
            git fetch --all
            git reset --hard origin/main

            echo "==> Installing backend deps"
            cd backend
            if [ -f requirements.txt ]; then
              if [ -d venv ]; then
                source venv/bin/activate
                # Hash lives inside the venv so a rebuilt venv always reinstalls
                REQ_MARKER=venv/.requirements.sha256
              fi
              REQ_HASH=$(sha256sum requirements.txt | cut -d' ' -f1)
              # No `else` here: script_stop injects an exit-on-$? check after
              # every line, so a false condition followed by `else` aborts.
              if [ -z "$REQ_MARKER" ] || [ "$(cat "$REQ_MARKER" 2>/dev/null)" != "$REQ_HASH" ]; then
                echo "requirements.txt changed, running pip install"
                pip install -r requirements.txt && { [ -z "$REQ_MARKER" ] || echo "$REQ_HASH" > "$REQ_MARKER"; } || true
              fi
            fi
            cd ..

            echo "==> Preparing fresh build directory"
            rm -rf frontend/build

      # ONE-OFF, Sep 30 2026 — dry run reviewed and confirmed correct against
      # cheque #041296's real ledger (₹98,000 across 4 bills, ₹1,22,600
      # credit voided, verified balance -₹67,100 -> +₹30,900). Now running
      # --apply for real. Remove this step once confirmed applied cleanly;
      # script_stop is off so a failure here never blocks the real deploy
      # below.
      - name: One-off - APPLY bounced-cheque material suspense backfill
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: false
          script: |
            cd ${{ secrets.VPS_APP_PATH }}/backend
            if [ -d venv ]; then source venv/bin/activate; fi
            python scripts/backfill_bounced_cheque_material_suspense.py --apply

      - name: Copy built frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "frontend/build/"
          target: "${{ secrets.VPS_APP_PATH }}"
          overwrite: true

      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}

            echo "==> Restoring production frontend .env on VPS"
            echo "REACT_APP_BACKEND_URL=https://myhomeusb.com" > frontend/.env

            echo "==> Ensuring swap exists (OOM protection)"
            if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab || true
            fi

            # Sep 30 2026 — Several backend workers instead of one, so a slow
            # request no longer freezes the ERP for everyone. uvicorn reads
            # WEB_CONCURRENCY; `pm2 start all --update-env` below passes it on.
            # Each step is one line that exits 0 (script_stop aborts on any
            # non-zero line); the scripts explain their choices.
            echo "==> Sizing backend workers"
            BACKEND_SIZING=$(bash hostinger_setup/backend_workers.sh || echo "1 script-failed")
            export WEB_CONCURRENCY=$(echo "$BACKEND_SIZING" | awk '{ n = $1 + 0; if (n < 1) n = 1; print n }')
            # Shown by GET /api/health, so the choice can be checked from outside.
            export WORKERS_SIZED_BY=$(echo "$BACKEND_SIZING" | awk '{ print $2 }')
            echo "WEB_CONCURRENCY=$WEB_CONCURRENCY ($WORKERS_SIZED_BY)"
            # --update-env copies this shell's whole environment into the app,
            # PATH included; keep the venv first as ecosystem.config.js does.
            export PATH="$PWD/backend/venv/bin:$PATH"

            echo "==> nginx: gzip + long cache for hashed /static/ files"
            bash hostinger_setup/nginx_static_cache.sh || true

            echo "==> Restarting PM2 backend (retrying on transient resource-throttle kills)"
            set +e
            RESTART_OK=0
            for attempt in 1 2 3; do
              echo "--- Attempt $attempt ---"
              # `restart`, not `start`: PM2 5's `start all` drops --update-env
              # (restartExistingNameSpace calls _operate without the options),
              # so no env change ever reached the backend. Stopping first still
              # frees memory before the new processes start.
              pm2 stop all && pm2 restart all --update-env
              if [ $? -eq 0 ]; then
                RESTART_OK=1
                break
              fi
              echo "Attempt $attempt failed, waiting 15s before retry..."
              sleep 15
            done
            set -e
            if [ "$RESTART_OK" -ne 1 ]; then
              echo "PM2 restart failed after 3 attempts"
              exit 1
            fi
            pm2 save

            echo "==> Verifying deployment"
            ls frontend/build/index.html
            pm2 status
            echo "===DEPLOY COMPLETE==="
