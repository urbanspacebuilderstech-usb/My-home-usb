# VPS_APP_PATH secret corrected to /var/www/myhomeusb/app
name: Deploy to Hostinger VPS (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build frontend on GitHub runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build with production env
        working-directory: frontend
        env:
          CI: false
        run: |
          echo "REACT_APP_BACKEND_URL=https://myhomeusb.com" > .env
          yarn build

      - name: Update backend code on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}
            echo "==> Pulling latest main (backend code)"
            git fetch --all
            git reset --hard origin/main

            echo "==> Installing backend deps"
            cd backend
            if [ -f requirements.txt ]; then
              if [ -d venv ]; then
                source venv/bin/activate
              fi
              pip install -r requirements.txt || true
            fi
            cd ..

            echo "==> Preparing fresh build directory"
            rm -rf frontend/build

      - name: Copy built frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "frontend/build/"
          target: "${{ secrets.VPS_APP_PATH }}"
          overwrite: true

      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}

            echo "==> Restoring production frontend .env on VPS"
            echo "REACT_APP_BACKEND_URL=https://myhomeusb.com" > frontend/.env

            echo "==> Ensuring swap exists (OOM protection)"
            if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab || true
            fi

            echo "==> Restarting PM2 backend (retrying on transient resource-throttle kills)"
            set +e
            RESTART_OK=0
            for attempt in 1 2 3; do
              echo "--- Attempt $attempt ---"
              pm2 stop all && pm2 start all --update-env
              if [ $? -eq 0 ]; then
                RESTART_OK=1
                break
              fi
              echo "Attempt $attempt failed, waiting 15s before retry..."
              sleep 15
            done
            set -e
            if [ "$RESTART_OK" -ne 1 ]; then
              echo "PM2 restart failed after 3 attempts"
              exit 1
            fi
            pm2 save

            echo "==> Verifying deployment"
            ls frontend/build/index.html
            pm2 status
            echo "===DEPLOY COMPLETE==="

      # TEMPORARY — one-time data heal for USB-MR034, stuck in Account
      # Approvals after its Aug 14 repair left the parent material_request at
      # pending_accounts_approval. Idempotent (no-op once corrected) and it
      # refuses to write unless the live state matches the diagnosis, so a
      # green step here means "applied and post-conditions verified" or
      # "already correct". Runs last, so a refusal cannot affect the deploy
      # itself. REMOVE THIS STEP once it has run.
      # Split into one step per check. Step output needs a token to read, but
      # per-step pass/fail is visible via the API, so the pattern of
      # conclusions localises a refusal without log access. The first three
      # stages are strictly read-only; only "apply" writes, and it is the one
      # step with no if:always() so it cannot run after a failed check.
      - name: 'heal 1/4: env + mongo reachable'
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}/backend
            if [ -d venv ]; then source venv/bin/activate; fi
            PY=$(command -v python || command -v python3)
            "$PY" scripts/fix_usb_mr034_stuck_pending.py --stage env

      - name: 'heal 2/4: records present'
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}/backend
            if [ -d venv ]; then source venv/bin/activate; fi
            PY=$(command -v python || command -v python3)
            "$PY" scripts/fix_usb_mr034_stuck_pending.py --stage records

      # Live probe on 2026-08-17 established: the bill IS paid (status=paid,
      # paid_amount=17,516) and the parent still sits at
      # pending_accounts_approval, so the original diagnosis holds. The only
      # failing check was the cheque lock — #001684 is already unlocked, a
      # separate defect that does not bear on whether THIS bill was paid, so
      # it is now reported rather than blocking, and left untouched.
      #
      # These are the probes that MUST pass. Each is if:always() so one run
      # reports them all; the apply step has no if:, so any failure skips the
      # write. cashbook-row-exists is the important new gate: if the
      # recorded_expenses row for this spend is gone, hiding the bill from
      # Approvals would drop ₹17,516 out of the Cashbook entirely.
      - name: 'probe: parent-pending'
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: cd ${{ secrets.VPS_APP_PATH }}/backend && { [ -d venv ] && . venv/bin/activate || true; } && $(command -v python || command -v python3) scripts/fix_usb_mr034_stuck_pending.py --assert parent-pending

      - name: 'probe: bill-paid'
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: cd ${{ secrets.VPS_APP_PATH }}/backend && { [ -d venv ] && . venv/bin/activate || true; } && $(command -v python || command -v python3) scripts/fix_usb_mr034_stuck_pending.py --assert bill-paid

      - name: 'probe: bill-amount'
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: cd ${{ secrets.VPS_APP_PATH }}/backend && { [ -d venv ] && . venv/bin/activate || true; } && $(command -v python || command -v python3) scripts/fix_usb_mr034_stuck_pending.py --assert bill-amount

      - name: 'probe: not-bounced'
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: cd ${{ secrets.VPS_APP_PATH }}/backend && { [ -d venv ] && . venv/bin/activate || true; } && $(command -v python || command -v python3) scripts/fix_usb_mr034_stuck_pending.py --assert not-bounced

      - name: 'heal: apply + verify'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: cd ${{ secrets.VPS_APP_PATH }}/backend && { [ -d venv ] && . venv/bin/activate || true; } && $(command -v python || command -v python3) scripts/fix_usb_mr034_stuck_pending.py --stage apply
